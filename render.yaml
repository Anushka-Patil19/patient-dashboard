# Render Blueprint: one web service (Docker) + managed PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: rural-outreach-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rural-outreach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PSEUDONYM_SECRET
        generateValue: true
      # Loads synthetic demo users and data on first boot (empty database only).
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: rural-outreach-db
    plan: free
    databaseName: outreach
    user: outreach
